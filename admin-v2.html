<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Style Saan Admin</title><link rel="stylesheet" href="style.css"><style>
:root{--gold:#d8b35a;--gold2:#9b7427;--ink:#0d0c0a;--card:#17140f;--muted:#a99b7b}body{margin:0;background:radial-gradient(circle at 50% -10%,#2b2111,#090807 55%);color:#f6efdf;min-height:100vh;font-family:system-ui,-apple-system,sans-serif}.admin-wrap{width:min(720px,100%);margin:auto;padding:20px 14px 40px}.brand{text-align:center;padding:14px 0 20px}.brand img{width:72px;height:72px;object-fit:contain;border-radius:18px;display:block;margin:0 auto 10px;filter:drop-shadow(0 8px 20px #000)}.brand h1{margin:0;font-size:1.15rem;letter-spacing:.08em}.brand p{margin:6px 0 0;color:var(--muted);font-size:.8rem}.card{background:linear-gradient(145deg,#19150f,#100e0b);border:1px solid #4b3b20;border-radius:22px;padding:18px;box-shadow:0 18px 50px #0008;margin-bottom:14px}.login-card{max-width:430px;margin:0 auto}.input{box-sizing:border-box;width:100%;background:#0c0b09;color:#fff;border:1px solid #4a3a20;border-radius:14px;padding:14px;margin:7px 0;font-size:15px;outline:none}.input:focus{border-color:var(--gold);box-shadow:0 0 0 3px #d8b35a18}.password-row{position:relative}.password-row .input{padding-right:54px}.eye{position:absolute;right:8px;top:8px;height:42px;width:42px;border:0;border-radius:12px;background:#221b10;color:var(--gold);font-size:18px}.btn{width:100%;border:0;border-radius:14px;padding:13px 14px;font-weight:800;margin-top:8px;cursor:pointer}.gold{background:linear-gradient(135deg,#9b7427,#e4c56a);color:#171107}.ghost{background:#201a12;color:#dbc687;border:1px solid #4b3b20}.danger{background:#5b201d;color:#fff}.tabs{display:flex;gap:6px;overflow:auto;padding-bottom:4px;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid #4b3b20;background:#15120e;color:#c9b77f;border-radius:12px;padding:9px 12px;font-weight:800}.tab.active{background:#b58a34;color:#160f05}.order{border:1px solid #44351f;border-radius:18px;background:#13110e;padding:14px;margin:10px 0}.order-head{display:flex;justify-content:space-between;gap:10px}.code{color:#e2c56d;font-weight:900}.meta{color:#b8aa8b;font-size:.86rem;line-height:1.55}.items{margin:10px 0;padding:10px;border-radius:12px;background:#0b0a08}.slip{width:100%;max-height:360px;object-fit:contain;border-radius:14px;border:1px solid #4b3b20;background:#080706;margin-top:8px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#2b2111;color:#e5c56b;font-size:.75rem}.hidden{display:none!important}.section-title{display:flex;justify-content:space-between;align-items:center}.small{font-size:.78rem;color:#9f947c}.error{color:#ff8e83;text-align:center;min-height:20px}.success{color:#a9df9e;text-align:center}.logout{margin-top:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{background:#0c0b09;color:#e6d8ae;border:1px solid #4b3b20;border-radius:12px;padding:11px;width:100%}@media(max-width:480px){.admin-wrap{padding:12px 10px 28px}.brand img{width:60px;height:60px}.card{padding:14px}.row{grid-template-columns:1fr}.order-head{display:block}}
</style></head><body><div class="admin-wrap"><header class="brand"><img src="https://lh3.googleusercontent.com/d/1bM_UNFnp1L8VyqSkPBIQwfUNdQX0-07J" alt="Style Saan"><h1>STYLE SAAN · ADMIN</h1><p>Wallet Shop Center • Fancy Shop Center</p></header><section id="login" class="card login-card"><h2 style="text-align:center;margin:0 0 10px">🔐 Admin Login</h2><input id="email" class="input" type="email" autocomplete="username" placeholder="Admin Gmail / Email"><div class="password-row"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button class="eye" id="eye" type="button">◉</button></div><button id="loginBtn" class="btn gold">Login to Dashboard →</button><div id="loginMsg" class="error"></div></section><main id="dashboard" class="hidden"><div class="tabs"><button class="tab active" data-tab="orders">📦 Orders</button><button class="tab" data-tab="stock">🏷️ Stock</button><button class="tab" data-tab="center">🛍️ Center</button><button class="tab" data-tab="drive">🔄 Drive</button><button class="tab" data-tab="reports">🚨 Reports</button><button class="tab" data-tab="songs">🎵 Songs</button></div><section id="orders" class="card panel"><div class="section-title"><h2>Orders</h2><span id="orderCount" class="pill">0</span></div><div id="ordersList"></div></section><section id="stock" class="card panel hidden"><h2>🏷️ Stock</h2><p class="small">Use the existing product data stored in Style Saan.</p><div id="productsList"></div></section><section id="center" class="card panel hidden"><h2>🛍️ Shop Centers</h2><div id="centerList"></div></section><section id="drive" class="card panel hidden"><h2>🔄 Drive Links</h2><input id="driveUrl" class="input" placeholder="Google Drive link"><button class="btn gold" id="driveBtn">Convert Direct Link</button><input id="driveOut" class="input" readonly placeholder="Direct link"><button class="btn ghost" id="copyDrive">Copy</button></section><section id="reports" class="card panel hidden"><h2>🚨 Customer Reports</h2><div id="reportsList"></div></section><section id="songs" class="card panel hidden"><h2>🎵 Songs</h2><div id="songsList"></div></section><button id="logout" class="btn ghost logout">Logout</button></main></div><script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="firebase-sync.js"></script><script>
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-US').format(Number(n||0))+' Ks';
$('eye').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password';$('eye').textContent=$('password').type==='password'?'◉':'◌'};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab));renderAll()});
async function auth(){const fb=await window.StyleSaanFirebaseReady;const {signInWithEmailAndPassword,onAuthStateChanged,signOut}=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js');onAuthStateChanged(fb.auth,user=>{if(user){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');renderAll()}else{$('login').classList.remove('hidden');$('dashboard').classList.add('hidden')}});$('loginBtn').onclick=async()=>{const e=$('email').value.trim(),p=$('password').value;if(!e||!p){$('loginMsg').textContent='Email နဲ့ Password ဖြည့်ပါ။';return}$('loginMsg').textContent='ဝင်နေပါပြီ…';try{await signInWithEmailAndPassword(fb.auth,e,p);$('loginMsg').textContent=''}catch(err){$('loginMsg').textContent='Login မအောင်မြင်ပါ။ Email/Password ကိုစစ်ပါ။'}};$('logout').onclick=()=>signOut(fb.auth)}
function data(k){try{return JSON.parse(localStorage.getItem(k)||'[]')||[]}catch{return[]}}
function renderAll(){renderOrders();renderProducts();renderCenters();renderReports();renderSongs()}
function renderOrders(){const a=data('style-orders');$('orderCount').textContent=a.length;$('ordersList').innerHTML=a.length?a.slice().reverse().map(o=>{const slip=o.slipImageUrl||o.paymentSlipUrl||o.slipUrl;return `<article class="order"><div class="order-head"><div><div class="code">${esc(o.orderCode||o.id)}</div><div class="meta">👤 ${esc(o.customerName)}<br>📞 ${esc(o.phone)}<br>🏪 ${esc(o.centerName||o.shopCenter||o.center||'—')}<br>🚚 ${esc(o.deliveryType||o.delivery||'—')}<br>💳 ${esc(o.paymentType||o.payment||'—')}<br>📍 ${esc(o.address||'—')}</div></div><span class="pill">${esc(o.status||'order စစ်ဆေးနေဆဲ')}</span></div><div class="items">${(o.items||[]).map(i=>`<div>${esc(i.name)} × ${Number(i.qty||1)} — ${money(Number(i.price||0)*Number(i.qty||1))}</div>`).join('')}</div><b>💰 Total: ${money(o.totalAmount||o.total)}</b>${slip?`<div class="small" style="margin-top:10px">🧾 Payment Slip</div><a href="${esc(slip)}" target="_blank" rel="noopener"><img class="slip" src="${esc(slip)}" alt="Payment Slip"></a>`:'<div class="small" style="margin-top:10px">🧾 Payment Slip မတင်ရသေးပါ။</div>'}<div class="meta" style="margin-top:10px">📝 ${esc(o.note||'မရှိပါ')}<br>🕐 ${esc(o.createdAt||'')}</div><input class="input" placeholder="Admin Note" value="${esc(o.adminNote||'')}" data-note="${esc(o.id)}"><select class="status" data-status="${esc(o.id)}"><option>order စစ်ဆေးနေဆဲ</option><option>အတည်ပြုပြီး</option><option>ပို့ဆောင်နေပြီ</option><option>ပြီးဆုံး</option><option>ပယ်ဖျက်</option></select></article>`}).join(''):'<p class="small">Order မရှိသေးပါ။</p>';document.querySelectorAll('[data-status]').forEach(s=>{const o=a.find(x=>String(x.id)===String(s.dataset.status));if(o)s.value=o.status||'order စစ်ဆေးနေဆဲ';s.onchange=()=>{const o=a.find(x=>String(x.id)===String(s.dataset.status));if(o){o.status=s.value;localStorage.setItem('style-orders',JSON.stringify(a))}}});document.querySelectorAll('[data-note]').forEach(i=>i.onchange=()=>{const o=a.find(x=>String(x.id)===String(i.dataset.note));if(o){o.adminNote=i.value;localStorage.setItem('style-orders',JSON.stringify(a))}})}
function renderProducts(){const a=data('style-products');$('productsList').innerHTML=a.length?a.map(p=>`<div class="order"><b>${esc(p.name)}</b><div class="meta">${esc(p.center)} • Stock ${Number(p.stock||0)} • ${money(p.price)}</div></div>`).join(''):'<p class="small">ပစ္စည်းမရှိသေးပါ။</p>'}
function renderCenters(){const a=data('style-products');$('centerList').innerHTML=['wallet','fancy'].map(c=>`<div class="order"><b>${c==='wallet'?'◈ Wallet Shop Center':'✦ Fancy Shop Center'}</b><div class="meta">${a.filter(p=>p.center===c).length} products</div></div>`).join('')}
function renderReports(){const a=data('style-reports');$('reportsList').innerHTML=a.length?a.map(r=>`<div class="order"><b>${esc(r.reportCode||r.id)}</b><div class="meta">${esc(r.message||r.report||'')}</div><div class="small">${esc(r.status||'စစ်ဆေးနေဆဲ')}</div></div>`).join(''):'<p class="small">Report မရှိသေးပါ။</p>'}
function renderSongs(){const a=data('style-songs');$('songsList').innerHTML=a.length?a.map(s=>`<div class="order"><b>${esc(s.name)}</b><div class="small">${esc(s.url)}</div></div>`).join(''):'<p class="small">Song မရှိသေးပါ။</p>'}
$('driveBtn').onclick=()=>{const u=$('driveUrl').value.trim();const m=u.match(/\/d\/([^/]+)/)||u.match(/[?&]id=([^&]+)/);$('driveOut').value=m?`https://drive.google.com/uc?export=view&id=${m[1]}`:u};$('copyDrive').onclick=()=>navigator.clipboard?.writeText($('driveOut').value);
window.addEventListener('load',()=>auth().catch(e=>{$('loginMsg').textContent='Firebase connection မရပါ။';console.error(e)}));
</script></body></html>
