<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Style Saan Admin</title><link rel="stylesheet" href="style.css"><style>body{background:#090806;color:#f5ead0}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:#15120d;border:1px solid #5a4725;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 16px 40px #0008}.logo{width:64px;height:64px;object-fit:contain;display:block;margin:auto;border-radius:16px}.muted{color:#a99b7b;font-size:.82rem}.input,select,textarea{width:100%;box-sizing:border-box;background:#0d0b09;color:#fff;border:1px solid #4b3a20;border-radius:12px;padding:12px;margin:6px 0}button{border:0;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer}.gold{background:linear-gradient(135deg,#9b7427,#e3c46b);color:#160f04}.dark{background:#241d12;color:#e4cb8a;border:1px solid #5a4725}.red{background:#7d2722;color:#fff}.tabs{display:flex;gap:5px;overflow:auto}.tab{white-space:nowrap;background:#19150e;color:#cdb779;border:1px solid #4b3a20}.tab.active{background:#b88d38;color:#170f04}.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}.item{border:1px solid #44351f;border-radius:15px;padding:12px;margin:9px 0;background:#100e0b}.photo{width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:8px}.danger{color:#ff9287}.success{color:#9be29a}.preview{width:100%;height:120px;object-fit:cover;border-radius:12px;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.actions button{flex:1;min-width:90px}.pill{display:inline-block;background:#2a2111;color:#e4c56d;border-radius:99px;padding:4px 8px;font-size:.72rem}</style></head><body><div class="wrap"><div class="card" style="text-align:center"><img class="logo" src="https://lh3.googleusercontent.com/d/1bM_UNFnp1L8VyqSkPBIQwfUNdQX0-07J"><h2>STYLE SAAN · ADMIN</h2><div class="muted">Wallet Shop Center • Fancy Shop Center</div></div><section id="login" class="card"><input id="email" class="input" type="email" placeholder="Admin Email"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="gold" style="width:100%">Login →</button><div id="msg" class="danger"></div></section><main id="dash" class="hidden"><div class="tabs"><button class="tab active" data-p="orders">📦 Orders</button><button class="tab" data-p="stock">🏷️ Stock</button><button class="tab" data-p="center">🛍️ Center</button><button class="tab" data-p="drive">🔄 Drive</button><button class="tab" data-p="reports">🚨 Reports</button><button class="tab" data-p="songs">🎵 Songs</button></div><section id="orders" class="card panel"><div class="row"><h3>Orders</h3><button id="resetOrders" class="red">Reset All</button></div><div id="ordersList"></div></section><section id="stock" class="card panel hidden"><h3>➕ Post / Edit Product</h3><input id="pid" type="hidden"><input id="pname" class="input" placeholder="ပစ္စည်းအမည်"><input id="pprice" class="input" type="number" placeholder="ဈေးနှုန်း (Ks)"><div class="row"><select id="pcenter"><option value="wallet">Wallet Shop Center</option><option value="fancy">Fancy Shop Center</option></select><input id="pstock" class="input" type="number" placeholder="Stock"></div><input id="pimg" class="input" placeholder="Google Drive / Image Direct Link"><button id="driveImg" class="dark">Google Drive Link → Image Link</button><img id="preview" class="preview hidden"><textarea id="pdetails" class="input" placeholder="Detail Photo Links — comma ခြားရေးပါ"></textarea><input id="pnote" class="input" placeholder="Product Note"><div class="actions"><button id="saveProduct" class="gold">Post / Save Product →</button><button id="cancelProduct" class="dark">Clear</button></div><h3>Current Products</h3><div id="productsList"></div></section><section id="center" class="card panel hidden"><h3>🛍️ Shop Centers</h3><div id="centerList"></div></section><section id="drive" class="card panel hidden"><h3>🔄 Google Drive Link Converter</h3><input id="driveInput" class="input" placeholder="Google Drive share link"><button id="convert" class="gold">Convert</button><input id="driveOutput" class="input" readonly></section><section id="reports" class="card panel hidden"><h3>🚨 Reports</h3><div id="reportsList"></div></section><section id="songs" class="card panel hidden"><h3>🎵 Chatbox.moe Song</h3><input id="sid" type="hidden"><input id="sname" class="input" placeholder="Song Name"><input id="surl" class="input" placeholder="Chatbox.moe song link"><div class="actions"><button id="saveSong" class="gold">Add / Save Song →</button><button id="clearSong" class="dark">Clear</button></div><div id="songsList"></div></section><button id="logout" class="dark" style="width:100%;margin-top:12px">Logout</button></main></div><script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="firebase-sync.js"></script><script>
const $=x=>document.getElementById(x), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=x=>new Intl.NumberFormat('en-US').format(Number(x)||0)+' Ks';let db,api;
function drive(x){x=(x||'').trim();let m=x.match(/\/d\/([^/]+)/)||x.match(/[?&]id=([^&]+)/);return m?'https://drive.google.com/uc?export=view&id='+m[1]:x}
async function start(){const fb=await window.StyleSaanFirebaseReady;db=fb.db;api=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js');const au=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js');const {signInWithEmailAndPassword,onAuthStateChanged,signOut}=au;onAuthStateChanged(fb.auth,u=>{if(u){$('login').classList.add('hidden');$('dash').classList.remove('hidden');refresh()}else{$('login').classList.remove('hidden');$('dash').classList.add('hidden')}});$('loginBtn').onclick=async()=>{try{await signInWithEmailAndPassword(fb.auth,$('email').value.trim(),$('password').value);$('msg').textContent=''}catch(e){$('msg').textContent='Login မအောင်မြင်ပါ'}};$('logout').onclick=()=>signOut(fb.auth)}
async function docs(col){const s=await api.getDocs(api.collection(db,col));return s.docs.map(d=>({id:d.id,...d.data()}))}
async function save(col,id,data){await api.setDoc(api.doc(db,col,id),data,{merge:true})}
async function del(col,id){await api.deleteDoc(api.doc(db,col,id))}
async function refresh(){renderOrders();renderProducts();renderCenters();renderReports();renderSongs()}
async function renderOrders(){const a=await docs('orders');$('ordersList').innerHTML=a.length?a.slice().sort((x,y)=>String(y.createdAt).localeCompare(String(x.createdAt))).map(o=>{let slip=o.slipImageUrl||o.paymentSlipUrl||o.slipUrl;return `<div class="item"><b class="pill">${esc(o.orderCode||o.id)}</b><p>👤 ${esc(o.customerName||'Customer')}<br>📞 ${esc(o.phone||'—')}<br>🏪 ${esc(o.centerName||o.shopCenter||o.center||'—')}<br>🚚 ${esc(o.deliveryType||'—')}<br>💳 ${esc(o.paymentType||'—')}<br>📍 ${esc(o.address||'—')}</p><div>${(o.items||[]).map(i=>esc(i.name)+' × '+Number(i.qty||1)).join('<br>')}</div><b>💰 ${money(o.totalAmount||o.total)}</b>${slip?`<a href="${esc(slip)}" target="_blank"><img class="photo" src="${esc(slip)}"></a>`:''}<p class="muted">📝 ${esc(o.note||'မရှိပါ')}</p><select class="status" data-id="${esc(o.id)}"><option>order စစ်ဆေးနေဆဲ</option><option>အတည်ပြုပြီး</option><option>ပို့ဆောင်နေပြီ</option><option>ပြီးဆုံး</option><option>ပယ်ဖျက်</option></select><textarea class="note input" data-id="${esc(o.id)}" placeholder="Admin Note">${esc(o.adminNote||'')}</textarea><div class="actions"><button class="gold saveOrder" data-id="${esc(o.id)}">Save</button><button class="red delOrder" data-id="${esc(o.id)}">Delete</button></div></div>`}).join(''):'<p class="muted">Order မရှိသေးပါ။</p>';for(const s of document.querySelectorAll('.status')){let o=a.find(x=>x.id===s.dataset.id);if(o)s.value=o.status||'order စစ်ဆေးနေဆဲ'}document.querySelectorAll('.saveOrder').forEach(b=>b.onclick=async()=>{let o=a.find(x=>x.id===b.dataset.id),s=document.querySelector(`.status[data-id="${b.dataset.id}"]`),n=document.querySelector(`.note[data-id="${b.dataset.id}"]`);await save('orders',o.id,{status:s.value,adminNote:n.value});refresh()});document.querySelectorAll('.delOrder').forEach(b=>b.onclick=async()=>{if(confirm('ဒီ order ကိုဖျက်မလား?')){await del('orders',b.dataset.id);refresh()}})}
$('resetOrders').onclick=async()=>{if(confirm('Order အားလုံးဖျက်မလား?')){for(const o of await docs('orders'))await del('orders',o.id);refresh()}};
async function renderProducts(){const a=await docs('products');$('productsList').innerHTML=a.length?a.map(p=>`<div class="item"><b>${esc(p.name)}</b><div class="muted">${esc(p.center)} • Stock ${p.stock||0} • ${money(p.price)}</div><img class="photo" src="${esc(p.showPhoto||p.image||drive(p.image||''))}"><div class="actions"><button class="gold editP" data-id="${esc(p.id)}">Edit</button><button class="red delP" data-id="${esc(p.id)}">Delete</button></div></div>`).join(''):'<p class="muted">ပစ္စည်းများ မရှိသေးပါ။</p>';document.querySelectorAll('.editP').forEach(b=>b.onclick=async()=>{let p=a.find(x=>x.id===b.dataset.id);$('pid').value=p.id;$('pname').value=p.name||'';$('pprice').value=p.price||'';$('pcenter').value=p.center||'wallet';$('pstock').value=p.stock||0;$('pimg').value=p.showPhoto||p.image||'';$('pdetails').value=(p.detailPhotos||p.details||[]).join(',');$('pnote').value=p.note||p.adminNote||'';$('preview').src=drive($('pimg').value);$('preview').classList.remove('hidden')});document.querySelectorAll('.delP').forEach(b=>b.onclick=async()=>{if(confirm('ဒီပစ္စည်းကိုဖျက်မလား?')){await del('products',b.dataset.id);refresh()}})}
$('saveProduct').onclick=async()=>{let id=$('pid').value||'p-'+Date.now();let p={id,name:$('pname').value.trim(),price:Number($('pprice').value||0),center:$('pcenter').value,stock:Number($('pstock').value||0),showPhoto:drive($('pimg').value),image:drive($('pimg').value),detailPhotos:$('pdetails').value.split(',').map(x=>drive(x)).filter(Boolean),details:$('pdetails').value.split(',').map(x=>drive(x)).filter(Boolean),note:$('pnote').value.trim(),adminNote:$('pnote').value.trim(),updatedAt:new Date().toISOString()};if(!p.name||!p.showPhoto)return alert('ပစ္စည်းအမည်နဲ့ Photo Link ဖြည့်ပါ');await save('products',id,p);$('cancelProduct').click();refresh()};$('cancelProduct').onclick=()=>['pid','pname','pprice','pimg','pdetails','pnote'].forEach(id=>$(id).value='');$('preview').classList.add('hidden');$('driveImg').onclick=()=>{$('pimg').value=drive($('pimg').value);$('preview').src=$('pimg').value;$('preview').classList.remove('hidden')};
async function renderCenters(){let a=await docs('products');$('centerList').innerHTML=['wallet','fancy'].map(c=>`<div class="item"><b>${c==='wallet'?'◈ Wallet Shop Center':'✦ Fancy Shop Center'}</b><div class="muted">${a.filter(x=>x.center===c).length} products</div></div>`).join('')}
async function renderReports(){let a=await docs('reports');$('reportsList').innerHTML=a.length?a.map(r=>`<div class="item"><b>${esc(r.reportCode||r.id)}</b><p>${esc(r.message||'')}</p><span class="pill">${esc(r.status||'စစ်ဆေးနေဆဲ')}</span></div>`).join(''):'<p class="muted">Report မရှိသေးပါ။</p>'}
async function renderSongs(){let a=await docs('songs');$('songsList').innerHTML=a.length?a.map(s=>`<div class="item"><b>🎵 ${esc(s.name)}</b><div class="muted">${esc(s.url)}</div><div class="actions"><button class="gold editS" data-id="${esc(s.id)}">Edit</button><button class="red delS" data-id="${esc(s.id)}">Delete</button></div></div>`).join(''):'<p class="muted">Song မရှိသေးပါ။</p>';document.querySelectorAll('.editS').forEach(b=>b.onclick=async()=>{let s=a.find(x=>x.id===b.dataset.id);$('sid').value=s.id;$('sname').value=s.name||'';$('surl').value=s.url||''});document.querySelectorAll('.delS').forEach(b=>b.onclick=async()=>{if(confirm('Song ဖျက်မလား?')){await del('songs',b.dataset.id);refresh()}})}
$('saveSong').onclick=async()=>{let id=$('sid').value||'s-'+Date.now();await save('songs',id,{id,name:$('sname').value.trim(),url:$('surl').value.trim(),updatedAt:new Date().toISOString()});$('clearSong').click();refresh()};$('clearSong').onclick=()=>{$('sid').value='';$('sname').value='';$('surl').value=''};
$('convert').onclick=()=>{$('driveOutput').value=drive($('driveInput').value)};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.p));refresh()});window.StyleSaanRenderAll=refresh;window.addEventListener('load',()=>start().catch(e=>{$('msg').textContent='Firebase connection မရပါ';console.error(e)}));</script></body></html>
