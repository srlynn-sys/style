<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Style — Shop</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><style>body:has(.intro-card) .page-head{display:none!important}body:has(.intro-card) .intro-card:after{content:"Contact Style Saan\A khainghsukh86@gmail.com\A +959 411 189 57  •  +95 795 751 076";white-space:pre;display:block;margin:30px auto 4px;padding:18px 10px 0;border-top:1px solid rgba(216,180,90,.18);font-size:12px;line-height:2;color:rgba(255,255,255,.62);text-align:center}@media(max-width:480px){body:has(.intro-card) .intro-card:after{font-size:11px;line-height:1.9;margin-top:24px}}.style-music-bubble{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f3d889,#a57a2d);color:#111;border:1px solid rgba(255,240,176,.65);box-shadow:0 10px 30px #0008,0 0 24px #d8b45a40;z-index:99999;cursor:pointer;font-size:25px;font-weight:900;animation:styleMusicFloat 3s ease-in-out infinite}.style-music-bubble::before{content:"";position:absolute;inset:-5px;border:1px solid #d8b45a47;border-radius:50%;animation:styleMusicPulse 2.2s ease-out infinite}.style-music-bubble.playing{animation:styleMusicSpin 3s linear infinite}.style-music-label{position:fixed;right:18px;bottom:86px;background:#0f0f0ff5;border:1px solid #d8b45a40;color:#e8d69c;padding:8px 11px;border-radius:12px;font-size:10px;font-weight:800;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s;z-index:99998}.style-music-label.show{opacity:1;transform:none}@keyframes styleMusicFloat{50%{transform:translateY(-6px)}}@keyframes styleMusicPulse{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}@keyframes styleMusicSpin{to{transform:rotate(360deg)}}</style></head><body><script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="app.js"></script><script src="firebase-sync.js"></script><script src="style-enhancements.js"></script><script src="music.js"></script></body></html>
