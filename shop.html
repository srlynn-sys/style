<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Style — Shop</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><style>body:has(.intro-card) .page-head{display:none!important}body:has(.intro-card) .intro-card:after{content:"Contact Style Saan\A khainghsukh86@gmail.com\A +959 411 189 57  •  +95 795 751 076";white-space:pre;display:block;margin:30px auto 4px;padding:18px 10px 0;border-top:1px solid rgba(216,180,90,.18);font-size:12px;line-height:2;color:rgba(255,255,255,.62);text-align:center}@media(max-width:480px){body:has(.intro-card) .intro-card:after{font-size:11px;line-height:1.9;margin-top:24px}}.style-music-bubble{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f3d889,#a57a2d);color:#111;border:1px solid rgba(255,240,176,.65);box-shadow:0 10px 30px #0008,0 0 24px #d8b45a40;z-index:99999;cursor:pointer;font-size:25px;font-weight:900;animation:styleMusicFloat 3s ease-in-out infinite}.style-music-bubble::before{content:"";position:absolute;inset:-5px;border:1px solid #d8b45a47;border-radius:50%;animation:styleMusicPulse 2.2s ease-out infinite}.style-music-bubble.playing{animation:styleMusicSpin 3s linear infinite}.style-music-label{position:fixed;right:18px;bottom:86px;background:#0f0f0ff5;border:1px solid #d8b45a40;color:#e8d69c;padding:8px 11px;border-radius:12px;font-size:10px;font-weight:800;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s;z-index:99998}.style-music-label.show{opacity:1;transform:none}@keyframes styleMusicFloat{50%{transform:translateY(-6px)}}@keyframes styleMusicPulse{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}@keyframes styleMusicSpin{to{transform:rotate(360deg)}}
/* Cinematic logo spotlights: the three orbiting lights visibly shine inward at the center logo. */
.intro-card .hero-orbit{overflow:visible}
.intro-card .hero-orbit span{width:8px;height:8px;margin:-4px;background:radial-gradient(circle,#fff8c9 0 18%,#f3d889 35%,#b77d20 70%,transparent 72%);box-shadow:0 0 7px #fff2ad,0 0 18px #e5b94f,0 0 30px rgba(216,180,90,.72);z-index:4}
.intro-card .hero-orbit span::before{content:"";position:absolute;right:3px;top:50%;width:76px;height:30px;transform:translateY(-50%);transform-origin:right center;background:linear-gradient(90deg,rgba(255,238,165,.03),rgba(244,208,111,.12),rgba(255,246,188,.30));clip-path:polygon(100% 38%,100% 62%,0 100%,0 0);filter:blur(4px);opacity:.72;animation:spotBeamPulse 1.9s ease-in-out infinite;pointer-events:none}
.intro-card .hero-orbit span::after{content:"";position:absolute;right:1px;top:50%;width:42px;height:10px;transform:translateY(-50%);background:linear-gradient(90deg,rgba(255,245,187,0),rgba(255,236,151,.46));filter:blur(3px);opacity:.9;pointer-events:none}
.intro-card .hero-orbit span:nth-child(2)::before{animation-delay:-.63s}.intro-card .hero-orbit span:nth-child(3)::before{animation-delay:-1.26s}
@keyframes spotBeamPulse{0%,100%{opacity:.38;filter:blur(5px)}50%{opacity:.82;filter:blur(3px)}}
.intro-card .main-logo{box-shadow:0 0 28px rgba(216,180,90,.22),0 0 65px rgba(216,180,90,.13);animation:floatLogoCentered 4s ease-in-out infinite,logoSpotlightGlow 2.8s ease-in-out infinite}
@keyframes logoSpotlightGlow{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12) drop-shadow(0 0 10px rgba(255,224,139,.42))}}
@media(max-width:600px){.intro-card .hero-orbit span{width:7px;height:7px;margin:-3.5px}.intro-card .hero-orbit span::before{width:65px;height:26px}.intro-card .hero-orbit span::after{width:36px;height:9px}}
</style></head><body><script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="app.js"></script><script src="firebase-sync.js"></script><script src="style-enhancements.js"></script><script src="music.js"></script></body></html>
