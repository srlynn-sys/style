<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Style — Shop</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><style>body:has(.intro-card) .page-head{display:none!important}body:has(.intro-card) .intro-card:after{content:"Contact Style Saan\A khainghsukh86@gmail.com\A +959 411 189 57  •  +95 795 751 076";white-space:pre;display:block;margin:30px auto 4px;padding:18px 10px 0;border-top:1px solid rgba(216,180,90,.18);font-size:12px;line-height:2;color:rgba(255,255,255,.62);text-align:center;letter-spacing:.2px}body:has(.intro-card) .intro-card:after{font-family:inherit}@media(max-width:480px){body:has(.intro-card) .intro-card:after{font-size:11px;line-height:1.9;margin-top:24px}}.style-music-bubble{position:fixed;right:18px;bottom:20px;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f3d889,#a57a2d);color:#111;border:1px solid rgba(255,240,176,.65);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 24px rgba(216,180,90,.25);z-index:9999;cursor:pointer;font-size:25px;font-weight:900;animation:styleMusicFloat 3s ease-in-out infinite}.style-music-bubble::before{content:"";position:absolute;inset:-5px;border:1px solid rgba(216,180,90,.28);border-radius:50%;animation:styleMusicPulse 2.2s ease-out infinite}.style-music-bubble.playing{animation:styleMusicSpin 3s linear infinite}.style-music-bubble.playing::after{content:"";position:absolute;inset:7px;border:1px dashed rgba(17,17,17,.35);border-radius:50%;animation:styleMusicSpinReverse 4s linear infinite}.style-music-label{position:fixed;right:18px;bottom:86px;background:rgba(15,15,15,.94);border:1px solid rgba(216,180,90,.25);color:#e8d69c;padding:8px 11px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:.5px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.25s;z-index:9998}.style-music-label.show{opacity:1;transform:none}@keyframes styleMusicFloat{50%{transform:translateY(-6px)}}@keyframes styleMusicPulse{0%{transform:scale(.85);opacity:.7}100%{transform:scale(1.35);opacity:0}}@keyframes styleMusicSpin{to{transform:rotate(360deg)}}@keyframes styleMusicSpinReverse{to{transform:rotate(-360deg)}}@media(max-width:600px){.style-music-bubble{right:14px;bottom:16px;width:54px;height:54px;font-size:23px}.style-music-label{right:14px;bottom:78px}}</style></head><body><script src="app.js"></script><script>(function(){if(!document.querySelector('.intro-card'))return;if(document.querySelector('.style-music-bubble'))return;var b=document.createElement('button');b.className='style-music-bubble';b.type='button';b.setAttribute('aria-label','Music');b.textContent='♫';var l=document.createElement('div');l.className='style-music-label';l.textContent='STYLE MUSIC';document.body.appendChild(l);document.body.appendChild(b);var ctx,osc,gain,playing=false,notes=[261.63,329.63,392,523.25,392,329.63],i=0,timer;function start(){ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();gain=ctx.createGain();gain.gain.value=.035;gain.connect(ctx.destination);playing=true;b.classList.add('playing');l.textContent='♫  MUSIC ON';l.classList.add('show');clearInterval(timer);function beat(){if(!playing)return;osc=ctx.createOscillator();osc.type='sine';osc.frequency.value=notes[i++%notes.length];osc.connect(gain);osc.start();osc.stop(ctx.currentTime+.42)}beat();timer=setInterval(beat,700)}function stop(){playing=false;b.classList.remove('playing');l.textContent='MUSIC OFF';clearInterval(timer);if(gain){gain.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.18)}setTimeout(function(){l.classList.remove('show')},700)}b.addEventListener('click',function(){playing?stop():start()})})();</script></body></html>
