<!doctype html><html lang="my"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Style — Order Success</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"></head><body><script src="firebase-config.js"></script><script src="firebase-client.js"></script><script src="app.js"></script><script src="firebase-sync.js"></script><script src="style-enhancements.js"></script><script>
(async function(){
  try{
    const code=new URLSearchParams(location.search).get('code');
    if(!code)return;
    const fb=await window.StyleSaanFirebaseReady;
    const {doc,getDoc}=await import('https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js');
    const snap=await getDoc(doc(fb.db,'orders',code));
    if(!snap.exists())return;
    const o={id:snap.id,...snap.data()};
    const host=document.querySelector('.success-card');
    if(!host)return;
    host.innerHTML='<div class="success-icon success-pop">✓</div><span class="eyebrow">ORDER RECEIVED</span><h2>Order တင်ပြီးပါပြီ</h2><p>Order Code</p><strong class="order-code" style="font-size:1.35rem;letter-spacing:.08em;display:inline-block;padding:10px 16px;border:1px solid rgba(216,179,90,.45);border-radius:14px;color:#d8b35a">'+(window.esc?window.esc(o.orderCode):o.orderCode)+'</strong><p style="margin-top:18px">'+(window.esc?window.esc(o.customerName||'Customer'):(o.customerName||'Customer'))+'</p><p>Total: <b>'+(window.money?window.money(o.totalAmount||o.total):((o.totalAmount||o.total)||0)+' Ks')+'</b></p><p class="muted">ဒီ Order Code ကို သိမ်းထားပြီး Order Status စစ်ဆေးတဲ့အခါ အသုံးပြုပါ။</p><a class="gold-btn" href="orders.html">Order Status ကြည့်မည် →</a><a class="gold-outline" href="shop.html">Continue Shopping</a>';
  }catch(e){console.error('[Style Saan] success order lookup failed',e)}
})();
</script></body></html>
